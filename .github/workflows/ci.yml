name: CI

on:


  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  wsl-container-test:
    runs-on: windows-2025

    steps:
      - name: Update WSL to preview
        shell: pwsh
        run: |
          wsl --shutdown
          wsl --update --pre-release

          Write-Host "Updated WSL:"
          wsl --version

          $wslc = Get-Command wslc.exe -ErrorAction SilentlyContinue
          if (-not $wslc) {
            throw "wslc.exe is still unavailable after updating WSL"
          }

          wslc version

      - name: Run Linux container
        shell: pwsh
        run: |
          wslc run --rm alpine:latest uname -a
