name: CI

on:
  workflow_dispatch:

jobs:
  wsl-container-test:
    runs-on: windows-2025

    steps:
      - name: Update WSL preview and locate WSLC
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          wsl --shutdown
          wsl --update --pre-release
          wsl --shutdown

          wsl --version

          $package = Get-AppxPackage MicrosoftCorporationII.WindowsSubsystemForLinux |
            Sort-Object Version -Descending |
            Select-Object -First 1

          if (-not $package) {
            throw "The WSL Appx/MSIX package was not found."
          }

          Write-Host "WSL package:"
          $package | Format-List Name, Version, InstallLocation, PackageFullName

          $wslc = Get-ChildItem `
            -LiteralPath $package.InstallLocation `
            -Filter wslc.exe `
            -File `
            -Recurse |
            Select-Object -First 1

          if (-not $wslc) {
            throw "wslc.exe is not present in WSL package $($package.PackageFullName)"
          }

          Write-Host "Found wslc at $($wslc.FullName)"

          # Save the exact path for following steps.
          "WSLC_PATH=$($wslc.FullName)" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          & $wslc.FullName version

      - name: Run Linux container
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          & $env:WSLC_PATH run --rm hello-world
          & $env:WSLC_PATH run --rm alpine:latest uname -a
