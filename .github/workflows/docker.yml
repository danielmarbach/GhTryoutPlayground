name: WSL Docker test

on:
  workflow_dispatch:

jobs:
  wsl-docker:
    runs-on: windows-2025

    steps:
      - name: Install Ubuntu in WSL
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          wsl.exe --set-default-version 2
          wsl.exe --install Ubuntu-24.04 --web-download --no-launch
          wsl.exe --list --verbose

      - name: Install Docker inside WSL
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          wsl.exe `
            --distribution Ubuntu-24.04 `
            --user root `
            -- bash -c 'set -euxo pipefail; apt-get update; DEBIAN_FRONTEND=noninteractive apt-get install --yes docker.io'

          if ($LASTEXITCODE -ne 0) {
            throw "Docker installation failed with exit code $LASTEXITCODE"
          }

      - name: Start Docker and run a container
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          wsl.exe `
            --distribution Ubuntu-24.04 `
            --user root `
            -- systemctl start docker

          if ($LASTEXITCODE -ne 0) {
            wsl.exe `
              --distribution Ubuntu-24.04 `
              --user root `
              -- systemctl status docker --no-pager

            throw "Docker service failed to start"
          }

          wsl.exe `
            --distribution Ubuntu-24.04 `
            --user root `
            -- docker info

          wsl.exe `
            --distribution Ubuntu-24.04 `
            --user root `
            -- docker run --rm alpine:latest uname -a

          if ($LASTEXITCODE -ne 0) {
            throw "Container execution failed with exit code $LASTEXITCODE"
          }

      - name: Test Docker networking
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
      
          # 1. Test outbound network access from a container.
          wsl.exe `
            --distribution Ubuntu-24.04 `
            --user root `
            -- docker run --rm alpine:latest `
            wget -qO- https://example.com
      
          if ($LASTEXITCODE -ne 0) {
            throw "Container outbound networking failed"
          }
      
          # 2. Test container-to-container networking and Docker DNS.
          wsl.exe `
            --distribution Ubuntu-24.04 `
            --user root `
            -- docker network create ci-network
      
          wsl.exe `
            --distribution Ubuntu-24.04 `
            --user root `
            -- docker run `
            --detach `
            --rm `
            --name web `
            --network ci-network `
            nginx:alpine
      
          try {
            wsl.exe `
              --distribution Ubuntu-24.04 `
              --user root `
              -- docker run `
              --rm `
              --network ci-network `
              alpine:latest `
              wget -qO- http://web
      
            if ($LASTEXITCODE -ne 0) {
              throw "Container-to-container networking failed"
            }
          }
          finally {
            wsl.exe `
              --distribution Ubuntu-24.04 `
              --user root `
              -- docker stop web
      
            wsl.exe `
              --distribution Ubuntu-24.04 `
              --user root `
              -- docker network rm ci-network
          }
      
          # 3. Publish a container port and access it from Windows.
          wsl.exe `
            --distribution Ubuntu-24.04 `
            --user root `
            -- docker run `
            --detach `
            --rm `
            --name published-web `
            --publish 127.0.0.1:8080:80 `
            nginx:alpine
      
          try {
            $response = $null
      
            for ($attempt = 1; $attempt -le 30; $attempt++) {
              try {
                $response = Invoke-WebRequest `
                  -Uri "http://localhost:8080" `
                  -UseBasicParsing `
                  -TimeoutSec 2
      
                break
              }
              catch {
                if ($attempt -eq 30) {
                  throw
                }
      
                Start-Sleep -Seconds 1
              }
            }
      
            Write-Host "HTTP status: $($response.StatusCode)"
      
            if ($response.StatusCode -ne 200) {
              throw "Expected HTTP 200 but received $($response.StatusCode)"
            }
          }
          finally {
            wsl.exe `
              --distribution Ubuntu-24.04 `
              --user root `
              -- docker stop published-web
          }
