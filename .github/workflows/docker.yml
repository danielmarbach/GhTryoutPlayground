name: WSL Docker test

on:
  workflow_dispatch:

jobs:
  wsl-docker:
    runs-on: windows-2025

    steps:
      - name: Install Ubuntu in WSL
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          wsl.exe --set-default-version 2
          wsl.exe --install Ubuntu-24.04 --web-download --no-launch
          wsl.exe --list --verbose

      - name: Install Docker inside WSL
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          wsl.exe `
            --distribution Ubuntu-24.04 `
            --user root `
            -- bash -c 'set -euxo pipefail; apt-get update; DEBIAN_FRONTEND=noninteractive apt-get install --yes docker.io'

          if ($LASTEXITCODE -ne 0) {
            throw "Docker installation failed with exit code $LASTEXITCODE"
          }

      - name: Start Docker and run a container
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          wsl.exe `
            --distribution Ubuntu-24.04 `
            --user root `
            -- systemctl start docker

          if ($LASTEXITCODE -ne 0) {
            wsl.exe `
              --distribution Ubuntu-24.04 `
              --user root `
              -- systemctl status docker --no-pager

            throw "Docker service failed to start"
          }

          wsl.exe `
            --distribution Ubuntu-24.04 `
            --user root `
            -- docker info

          wsl.exe `
            --distribution Ubuntu-24.04 `
            --user root `
            -- docker run --rm alpine:latest uname -a

          if ($LASTEXITCODE -ne 0) {
            throw "Container execution failed with exit code $LASTEXITCODE"
          }

      - name: Test container networking from Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
      
          wsl.exe `
            --distribution Ubuntu-24.04 `
            --user root `
            -- docker run `
            --detach `
            --rm `
            --name published-web `
            --publish 8080:80 `
            nginx:alpine
      
          try {
            # Verify that Docker published the expected port.
            wsl.exe `
              --distribution Ubuntu-24.04 `
              --user root `
              -- docker port published-web
      
            # Verify the service from inside WSL first.
            wsl.exe `
              --distribution Ubuntu-24.04 `
              --user root `
              -- curl `
              --fail `
              --show-error `
              --silent `
              http://127.0.0.1:8080 `
              --output /dev/null
      
            if ($LASTEXITCODE -ne 0) {
              throw "The published port is not reachable inside WSL"
            }
      
            # Get the address Windows can use to reach the WSL VM.
            $wslAddresses = (
              wsl.exe `
                --distribution Ubuntu-24.04 `
                -- hostname -I
            ).Trim().Split(
              " ",
              [System.StringSplitOptions]::RemoveEmptyEntries
            )
      
            $wslIp = $wslAddresses |
              Where-Object { $_ -match '^\d+\.\d+\.\d+\.\d+$' } |
              Select-Object -First 1
      
            if (-not $wslIp) {
              throw "Could not determine the WSL IPv4 address"
            }
      
            Write-Host "WSL address: $wslIp"
      
            $uri = "http://${wslIp}:8080"
            $response = $null
      
            for ($attempt = 1; $attempt -le 30; $attempt++) {
              try {
                $response = Invoke-WebRequest `
                  -Uri $uri `
                  -UseBasicParsing `
                  -TimeoutSec 5
      
                break
              }
              catch {
                Write-Host "Attempt $attempt failed: $($_.Exception.Message)"
      
                if ($attempt -eq 30) {
                  throw
                }
      
                Start-Sleep -Seconds 1
              }
            }
      
            Write-Host "HTTP status: $($response.StatusCode)"
      
            if ($response.StatusCode -ne 200) {
              throw "Expected HTTP 200, received $($response.StatusCode)"
            }
          }
          finally {
            wsl.exe `
              --distribution Ubuntu-24.04 `
              --user root `
              -- docker logs published-web 2>&1
      
            wsl.exe `
              --distribution Ubuntu-24.04 `
              --user root `
              -- docker stop published-web
          }
